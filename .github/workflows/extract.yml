name: extract-rosetta
on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: macos-15
    steps:
      - name: Install Rosetta
        run: sudo softwareupdate --install-rosetta --agree-to-license || true

      - name: Collect files
        run: |
          mkdir -p out
          PATHS=""
          for p in \
            Library/Apple/usr/libexec/oah \
            Library/Apple/usr/share/rosetta \
            usr/libexec/rosetta \
            usr/lib/libRosetta.dylib \
            usr/lib/dyld \
            usr/bin/arch \
            System/Library/LaunchDaemons/com.apple.oahd.plist \
            System/Library/LaunchDaemons/com.apple.oahd-root-helper.plist \
            System/Library/Kernels
          do
            [ -e "/$p" ] && PATHS="$PATHS $p" || echo "missing: /$p"
          done
          for f in /System/Volumes/Preboot/Cryptexes/OS/System/Library/dyld/dyld_shared_cache_x86_64*; do
            [ -e "$f" ] && PATHS="$PATHS ${f#/}"
          done
          echo "Archiving:$PATHS"
          sudo tar -C / -cf out/rosetta-full.tar $PATHS
          sudo chown "$USER" out/rosetta-full.tar
          sw_vers > out/macos-version.txt
          pkgutil --files com.apple.pkg.RosettaUpdateAuto > out/pkg-files.txt || true
          sudo find /Library/Apple /usr /System/Library /System/Volumes/Preboot/Cryptexes/OS /private/var/db \
            \( -iname '*oah*' -o -iname '*rosetta*' \) -print 2>/dev/null > out/all-rosetta-paths.txt || true
          ls -lh out/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: rosetta-full
          path: out/
          retention-days: 7
